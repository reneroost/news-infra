[Unit]
# No start limit. A crash that a client can trigger must never leave the unit stopped, which a
# limit of N starts per interval does once it is crashed N times. A binary or Caddyfile that
# cannot start at all retries every 15 seconds instead, which costs nothing.
StartLimitIntervalSec=0

[Service]
EnvironmentFile=/etc/caddy/backend.env
Restart=on-failure
# 2s, 4s, 8s, then 15s for every later automatic restart until the next manual start, which
# resets the count.
RestartSec=2s
RestartSteps=3
RestartMaxDelaySec=15s
# A Go runtime fatal error (a concurrent map write) prints only the goroutine that detected it.
# `all` also prints the one that caused it, which is what an upstream report needs.
Environment=GOTRACEBACK=all
